name: Validate marketing workspace
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run check:workspace
      - run: bun run check-types
      - run: bun run test
      - run: bun run lint
      - run: python3 -m unittest discover -s tests -p "test_*release*.py"
      - run: bun run build
        env:
          NEXT_PUBLIC_CONTACT_ENDPOINT: /api/contact
          NEXT_PUBLIC_FAIRHELM_CONTACT_ENABLED: ${{ vars.FAIRHELM_CONTACT_ENABLED }}
      - name: Verify contact human-check retry in desktop and phone browsers
        shell: bash
        run: |
          set -euo pipefail
          tools/quality/node_modules/.bin/playwright install --with-deps chromium
          bun run --cwd tools/quality test:browser tests/contact-human-check.spec.ts --project=phone-390 --project=desktop-1440
      # Package the outputs of this exact validated build. A later deployment
      # job must consume this artifact rather than rebuilding the five sites.
      - name: Package validated production sites
        shell: bash
        run: |
          set -euo pipefail
          for site in squarecampus fairhelm blogs legal press; do
            test -s "apps/$site/out/index.html"
          done
          grep -R -q -F '/api/contact' apps/squarecampus/out
          mkdir -p release
          for site in squarecampus fairhelm blogs legal press; do
            tar -C "apps/$site/out" -cf "release/$site.tar" .
          done
          python3 scripts/verify-release-archives.py apps release
          (cd release && sha256sum squarecampus.tar fairhelm.tar blogs.tar legal.tar press.tar > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > release/COMMIT
          python3 scripts/check-release-artifact.py release "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        with:
          name: marketing-production-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
